name: Bump nanobot-ai

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bump-nanobot
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Bump nanobot-ai and add-on version
        id: bump
        run: python3 .github/scripts/bump_nanobot.py

      # Apply patches/ingress_fix.py to the new release and confirm both
      # targets were patched, so a PR never silently ships a broken WebUI.
      - name: Verify ingress patch against new release
        id: patch
        if: steps.bump.outputs.updated == 'true'
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          pip download --quiet --no-deps --dest "$work" "nanobot-ai==${{ steps.bump.outputs.new_nanobot }}"
          (cd "$work" && python3 -m zipfile -e nanobot_ai-*.whl pkg)
          status=ok
          PYTHONPATH="$work/pkg" python3 agent/patches/ingress_fix.py 2>&1 | tee "$work/log" || status=failed
          grep -q "hassio_ingress" "$work/pkg/nanobot/web/dist/index.html" || status=failed
          grep -q "X-Ingress-Path" "$work/pkg/nanobot/webui/ws_http.py" || status=failed
          echo "status=$status" >> "$GITHUB_OUTPUT"
          {
            echo 'log<<EOF'
            cat "$work/log"
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Open pull request
        if: steps.bump.outputs.updated == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          branch: auto/bump-nanobot
          delete-branch: true
          commit-message: >-
            chore: update nanobot-ai to ${{ steps.bump.outputs.new_nanobot }}
            and bump addon to ${{ steps.bump.outputs.new_addon }}
          title: >-
            chore: update nanobot-ai to ${{ steps.bump.outputs.new_nanobot }}
            and bump addon to ${{ steps.bump.outputs.new_addon }}
          body: |
            Automated bump from the `Bump nanobot-ai` workflow.

            - `nanobot-ai` ${{ steps.bump.outputs.old_nanobot }} → **${{ steps.bump.outputs.new_nanobot }}** (`agent/Dockerfile`)
            - Add-on ${{ steps.bump.outputs.old_addon }} → **${{ steps.bump.outputs.new_addon }}** (`agent/config.yaml`)

            Ingress patch check: **${{ steps.patch.outputs.status == 'ok' && '✅ applies cleanly' || '❌ FAILED — update agent/patches/ingress_fix.py before merging' }}**

            ```
            ${{ steps.patch.outputs.log }}
            ```

            Release notes: https://github.com/HKUDS/nanobot/releases
